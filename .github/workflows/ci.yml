name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Rust steps are needed
        id: scope
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_ci_changed_scope.py'
          python3 scripts/ci_changed_scope.py --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git diff --check
      - run: python3 scripts/check_current_facts.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_current_facts.py'
      - run: python3 scripts/check_daily_sync_eval.py
      - name: Deployment facts checks (STATUS.md freshness, version, host rules)
        run: |
          python3 scripts/check_deploy_facts.py
          python3 -B -m unittest discover -s scripts -p 'test_deploy_facts.py'
      - name: Public hygiene (no e-mail, internal host name or private address in tracked text)
        run: |
          python3 scripts/check_public_hygiene.py
          python3 -B -m unittest discover -s scripts -p 'test_public_hygiene.py'
      - name: Deployment script dry-run and readiness-probe checks (never executes; tempdir root)
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_switch_binary.py'
          python3 -B -m unittest discover -s scripts -p 'test_rollback_preview.py'
          python3 -B -m unittest discover -s scripts -p 'test_wait_service_ready.py'
      - name: Analysis backtest checks (synthetic fixture, never the live database)
        run: python3 -B -m unittest discover -s scripts -p 'test_boll_analysis.py'
      - name: v8 read-surface token budgets (fixtures only, no data)
        run: python3 -B -m unittest discover -s scripts -p 'test_v8_token_budget.py'
      - run: cargo fmt --check
      - if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - if: steps.scope.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - name: Test environment (XP-024 A0)
        if: steps.scope.outputs.rust == 'true'
        run: |
          echo "nproc=$(nproc)"
          df -h /dev/shm
          echo "TMPDIR=$TMPDIR"
        env:
          TMPDIR: /dev/shm
      - name: Test inventory per target
        if: steps.scope.outputs.rust == 'true'
        run: cargo nextest list --locked --message-format oneline | awk '{c[$1]++} END {for (k in c) print k, c[k]}' | sort
        env:
          TMPDIR: /dev/shm
      - name: Tests (nextest)
        if: steps.scope.outputs.rust == 'true'
        run: cargo nextest run --locked --no-fail-fast
        env:
          TMPDIR: /dev/shm
      - name: Doc tests (nextest does not run them)
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --doc --locked
        env:
          TMPDIR: /dev/shm
      - if: steps.scope.outputs.rust == 'true'
        run: cargo build --locked
      - name: Runtime cross-UID boundary on an isolated fixture (not live source)
        if: steps.scope.outputs.rust == 'true'
        run: sudo -n python3 scripts/test_runtime_peer.py --bin-dir "$PWD/target/debug"
      - name: Issue 54 offline diagnostic evidence (not live source validation)
        run: |
          python3 -B evidence/issue-54-gbbq-decimal/analyze_matrix.py --check
          python3 -B -m unittest discover -s evidence/issue-54-gbbq-decimal -p 'test_*.py'
      - name: Issue 90 community scalar diagnostics (not official QFQ validation)
        run: |
          python3 -B evidence/issue-90-community-qfq/compare.py --check
          python3 -B -m unittest discover -s evidence/issue-90-community-qfq -p 'test_*.py'
      - name: Issue 383 qfq-exact Fraction reference (offline fixture, not live source)
        run: |
          python3 -B evidence/issue-383-qfq-exact/reference.py --check
          python3 -B -m unittest discover -s evidence/issue-383-qfq-exact -p 'test_*.py'

  # M1 PR-8 (issue-383 §7): the research exporter is an optional feature, so it
  # gets its own job instead of slowing down the default Rust path. The job
  # proves three things the default job cannot: the `export` feature compiles
  # and its tests pass, a real snapshot is readable by the third-party readers a
  # researcher uses (pyarrow/duckdb, §7.5), and the release build's size and
  # build time are recorded (§7.6 "体积预算" — the two numbers go in the PR).
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Rust steps are needed
        id: scope
        run: |
          python3 scripts/ci_changed_scope.py --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'
        with:
          key: export
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.rust == 'true'
        with:
          tool: nextest@0.9.146
      - name: Tests with the export feature
        if: steps.scope.outputs.rust == 'true'
        run: cargo nextest run --features export --locked
        env:
          TMPDIR: /dev/shm
      - name: Leave a real snapshot on disk for the third-party readers
        if: steps.scope.outputs.rust == 'true'
        run: |
          X_DATA_EXPORT_SMOKE_DIR="$PWD/export-smoke" \
            cargo test --features export --locked smoke_export_for_external_readers
          test -f export-smoke/snapshot-id.txt
        env:
          TMPDIR: /dev/shm
      - name: Read the snapshot with pyarrow and duckdb (§7.5)
        if: steps.scope.outputs.rust == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/research-venv"
          "$RUNNER_TEMP/research-venv/bin/pip" install --disable-pip-version-check \
            'pyarrow==26.0.0' 'duckdb==2.0.0'
          "$RUNNER_TEMP/research-venv/bin/python" scripts/export_smoke.py \
            --snapshot-dir "export-smoke/$(cat export-smoke/snapshot-id.txt)"
      - name: Release build cost (§7.6)
        if: steps.scope.outputs.rust == 'true'
        run: |
          start=$(date +%s)
          cargo build --features export --release --locked --bin export_research
          seconds=$(( $(date +%s) - start ))
          bytes=$(stat -c%s target/release/export_research)
          {
            echo "### export_research release build (feature \`export\`)"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| binary bytes | ${bytes} |"
            echo "| build seconds (warm cache) | ${seconds} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "export_research: ${bytes} bytes, ${seconds}s"
