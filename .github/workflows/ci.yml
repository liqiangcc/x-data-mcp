name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --locked
      - name: Issue 54 offline diagnostic evidence (not live source validation)
        run: |
          python3 -B evidence/issue-54-gbbq-decimal/analyze_matrix.py --check
          python3 -B -m unittest discover -s evidence/issue-54-gbbq-decimal -p 'test_*.py'
