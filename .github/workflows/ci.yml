name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git diff --check
      - run: python3 scripts/check_current_facts.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Runtime cross-UID boundary on an isolated fixture (not live source)
        run: sudo -n python3 scripts/test_runtime_peer.py --bin-dir "$PWD/target/debug"
      - name: Issue 54 offline diagnostic evidence (not live source validation)
        run: |
          python3 -B evidence/issue-54-gbbq-decimal/analyze_matrix.py --check
          python3 -B -m unittest discover -s evidence/issue-54-gbbq-decimal -p 'test_*.py'
      - name: Issue 90 community scalar diagnostics (not official QFQ validation)
        run: |
          python3 -B evidence/issue-90-community-qfq/compare.py --check
          python3 -B -m unittest discover -s evidence/issue-90-community-qfq -p 'test_*.py'
