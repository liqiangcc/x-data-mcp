[package]
name = "x-data-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tempfile = "3"
sha2 = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }

# Stage C: derive discoverable schemas from the same typed wire contracts.
schemars = { version = "1", features = ["chrono04"] }

# Exact rational final rounding for the bounded Stage D algorithm.
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
# Validate generated wire schemas against real stdio results; no HTTP schema resolution.
jsonschema = { version = "0.33", default-features = false }
