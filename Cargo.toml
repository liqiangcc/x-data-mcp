[package]
name = "x-data-mcp"
version = "0.2.0-preview.38"
edition = "2024"

# M1 PR-8 (issue-383 §7.6): the research snapshot exporter is an optional
# feature, so the default build/test path does not compile a Parquet stack.
[features]
default = []
export = ["dep:parquet"]

# `export_research` exists only with the feature; a default build keeps
# producing exactly the binaries it produced before.
[[bin]]
name = "export_research"
path = "src/bin/export_research.rs"
required-features = ["export"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tempfile = "3"
sha2 = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "cache"], default-features = false }

# Stage C: derive discoverable schemas from the same typed wire contracts.
schemars = { version = "1", features = ["chrono04"] }

# Exact rational final rounding for the bounded Stage D algorithm.
num-bigint = "0.4"
num-traits = "0.2"
encoding_rs = "0.8.41"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
serde_json_canonicalizer = "=0.3.2"

# Research snapshot writer (issue-383 §7.6): low-level `SerializedFileWriter`
# only, no Arrow. `snap` is a pure-Rust Snappy implementation, so the export
# feature adds no C toolchain dependency. The writer lives in
# `src/research/parquet.rs`.
parquet = { version = "59.3.2", optional = true, default-features = false, features = ["snap"] }

[dev-dependencies]
# Validate generated wire schemas against real stdio results; no HTTP schema resolution.
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuse the already locked libc for fd-based local-filesystem verification.
libc = "=0.2.189"

[profile.dev.package."*"]
# XP-024: optimize dependencies (bundled SQLite C code is otherwise -O0
# in test builds).
opt-level = 3

[profile.dev]
# Keep .debug_* sections out of linked binaries (separate .dwo files on Linux):
# less link I/O and a smaller target dir for the edit-build loop.
split-debuginfo = "unpacked"
# XP-026 S6: this crate at -O1 in dev/test — the CI critical path
# (two_fifty_day_append_growth_stays_bounded) is dominated by the crate's
# own -O0 code. Assertions and overflow checks stay on; the test profile
# inherits dev settings.
opt-level = 1
debug-assertions = true
overflow-checks = true
